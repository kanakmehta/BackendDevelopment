<ul class="task-list">
    {% for task in tasks %}
    <li class="task-item">
        <span class="task-title">
            {% if task.completed %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}
        </span>
        <span class="task-actions">
            <a href="{% url 'toggle_task' task.id %}">Toggle</a>
            <a href="{% url 'delete_task' task.id %}">Delete</a>
        </span>
    </li>
    {% empty %}
    <li class="empty">No tasks yet.</li>
    {% endfor %}
</ul>
