<ul class="task-list">
    {% for task in tasks %}
    <li class="task-item">
        <span class="{% if task.completed %}completed{% endif %}">{{ task.title }}</span>
        <div class="task-actions">
            <form method="post" action="{% url 'toggle_task' task.id %}">
                {% csrf_token %}
                <button type="submit">{% if task.completed %}Mark incomplete{% else %}Mark complete{% endif %}</button>
            </form>
            <form method="post" action="{% url 'delete_task' task.id %}">
                {% csrf_token %}
                <button class="danger" type="submit">Delete</button>
            </form>
        </div>
    </li>
    {% empty %}
    <li>No tasks yet. Add your first task.</li>
    {% endfor %}
</ul>
